name: cascade

services:
  broker:
    image: ${CASCADE_IMAGE:-cascade:local}
    build:
      context: .
      args:
        VERSION: ${CASCADE_VERSION:-1.3.0}
        REVISION: ${CASCADE_REVISION:-local}
        CREATED: ${CASCADE_CREATED:-unknown}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CASCADE_PORT:-9092}:9092"
    environment:
      JAVA_TOOL_OPTIONS: ${CASCADE_JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8}
      CASCADE_OPERATIONS_PORT: "9404"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "9092"
      - --advertised-host
      - ${CASCADE_ADVERTISED_HOST:-localhost}
      - --advertised-port
      - "${CASCADE_PORT:-9092}"
      - --data-dir
      - /var/lib/cascade
      - --operations-port
      - "9404"
    volumes:
      - cascade-data:/var/lib/cascade
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    stop_grace_period: 2m

volumes:
  cascade-data:
