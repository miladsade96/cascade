apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cascade-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cascade-broker-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cascade
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cascade
        - namespaceSelector:
            matchLabels:
              cascade.dev/client-access: "true"
      ports:
        - protocol: TCP
          port: 9092
    - from:
        - namespaceSelector:
            matchLabels:
              cascade.dev/monitoring-access: "true"
      ports:
        - protocol: TCP
          port: 9404
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cascade
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
