name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: azure/setup-kubectl@v4
      - name: Unit, integration, and end-to-end tests
        run: |
          chmod +x sbt
          ./sbt test
      - name: Render deployment and validate dashboard JSON
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/cascade-kubernetes.yaml
          test -s /tmp/cascade-kubernetes.yaml
          jq empty deploy/kubernetes/dashboards/cascade.json
