name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: azure/setup-kubectl@v4
      - name: Unit, integration, and end-to-end tests
        run: |
          chmod +x sbt
          ./sbt test
      - name: Render deployment and validate dashboard JSON
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/cascade-kubernetes.yaml
          test -s /tmp/cascade-kubernetes.yaml
          jq empty deploy/kubernetes/dashboards/cascade.json

  client-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: compatibility/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: compatibility/python/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version-file: compatibility/go/go.mod
          cache-dependency-path: compatibility/go/go.sum
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: compatibility/dotnet/CascadeCompatibility.csproj
      - name: Run external Kafka client matrix
        run: |
          chmod +x sbt compatibility/run.sh
          compatibility/run.sh

  coordinator-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Qualify concurrent coordinator writes, failover, and restart
        run: |
          chmod +x sbt
          ./sbt "Test / runMain cascade.qualification.CoordinatorScaleQualification --groups 1000 --concurrency 8 --rounds 2 --report artifacts/coordinator-scale.json"
          jq -e '.status == "passed" and .verified == 1000 and .writes == 3000 and .controller_failover and .restart_recovery and (.owner_ids | length) == 3 and .delta_bytes < .full_image_bytes and .journal_delta_bytes > 0 and .replication_delta_bytes > 0' artifacts/coordinator-scale.json
      - name: Archive coordinator qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-scale-evidence
          path: artifacts/coordinator-scale.json
          if-no-files-found: warn

  rolling-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: ["1.0.0", "format9"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Qualify pinned baseline against current release
        shell: pwsh
        run: ./scripts/qualify-rolling-upgrade.ps1 -Baseline '${{ matrix.baseline }}' -Report artifacts/rolling-upgrade.json
      - name: Archive rolling-upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-upgrade-evidence-${{ matrix.baseline }}
          path: artifacts/rolling-upgrade.json
          if-no-files-found: warn
