name: Container image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Resolve and validate the release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a semantic version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the attestation-preserving image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - uses: docker/setup-buildx-action@v4

      - name: Install checksum-pinned Docker Scout
        run: bash scripts/install-scout.sh

      - name: Test fail-closed image security policy
        run: node --test scripts/qualify-image-security.test.mjs

      - name: Qualify bounded cross-owner coordinator publication
        run: >-
          ./sbt "testOnly cascade.coordinator.CoordinatorDeltaBatcherSuite
          cascade.coordinator.CoordinatorShardStateSuite
          cascade.cluster.CoordinatorPublicationQuorumSuite"

      - name: Run the complete Scala test suite
        run: |
          chmod 0755 sbt
          ./sbt test

      - name: Validate the Dockerfile
        run: docker build --check .

      - name: Build the smoke-test image
        run: |
          docker buildx build --platform linux/amd64 --load --sbom=true --provenance=mode=max \
            --build-arg VERSION="${{ steps.release.outputs.version }}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --tag cascade:smoke \
            .

      - name: Start Cascade as a non-root read-only container
        run: |
          docker volume create cascade-smoke-data
          docker run --detach \
            --name cascade-smoke \
            --init \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,nosuid,nodev,noexec \
            --volume cascade-smoke-data:/var/lib/cascade \
            --publish 19092:9092 \
            cascade:smoke \
            --host 0.0.0.0 \
            --port 9092 \
            --advertised-host localhost \
            --advertised-port 19092 \
            --data-dir /var/lib/cascade \
            --operations-port 9404

      - name: Wait for readiness
        run: |
          for _attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cascade-smoke)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' cascade-smoke)" = exited ]; then
              docker logs cascade-smoke
              exit 1
            fi
            sleep 1
          done
          docker inspect cascade-smoke
          docker logs cascade-smoke
          exit 1

      - name: Verify image security metadata and Kafka data flow
        run: |
          test "$(docker inspect --format '{{.Config.User}}' cascade:smoke)" = "65532:65532"
          ./sbt "Test/runMain cascade.e2e.ExternalBrokerSmokeTest 127.0.0.1:19092 container-smoke-ci"

      - name: Verify graceful restart and volume recovery
        run: |
          docker restart --timeout 120 cascade-smoke
          for _attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' cascade-smoke)" = healthy ]; then
              ./sbt "Test/runMain cascade.e2e.ExternalBrokerSmokeTest 127.0.0.1:19092 container-smoke-ci --verify-only"
              exit 0
            fi
            sleep 1
          done
          docker logs cascade-smoke
          exit 1

      - name: Qualify TLS and SASL using the packaged JVM and broker
        shell: pwsh
        run: ./scripts/qualify-image-runtime.ps1 -BrokerImage cascade:smoke -ExpectedVersion '${{ steps.release.outputs.version }}'

      - name: Block publication on vulnerabilities or scanner errors
        run: node scripts/qualify-image-security.mjs cascade:smoke '${{ steps.release.outputs.version }}' artifacts/container-security

      - name: Preserve the exact qualified image for publication
        uses: actions/upload-artifact@v4
        with:
          name: qualified-container
          path: artifacts/container-security
          if-no-files-found: error
          retention-days: 7

      - name: Preserve scan diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-container-security
          path: |
            artifacts/container-security/*.json
            artifacts/container-security/*.log
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: docker logs cascade-smoke || true

      - name: Remove smoke-test resources
        if: always()
        run: |
          docker rm --force cascade-smoke || true
          docker volume rm cascade-smoke-data || true

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the attestation-preserving image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - uses: docker/setup-buildx-action@v4

      - name: Install checksum-pinned Docker Scout
        run: bash scripts/install-scout.sh

      - uses: actions/download-artifact@v4
        with:
          name: qualified-container
          path: artifacts/qualified-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-scan and publish only the tested immutable image
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test "$(jq -r .status artifacts/qualified-container/result.json)" = passed
          test "$(jq -r .version artifacts/qualified-container/result.json)" = "$RELEASE_VERSION"
          expected="$(jq -r .imageId artifacts/qualified-container/result.json)"
          [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker load --input artifacts/qualified-container/image.tar
          node scripts/qualify-image-security.mjs "$expected" "$RELEASE_VERSION" artifacts/publication-security
          target="$DOCKERHUB_USERNAME/cascade:$RELEASE_VERSION"
          docker tag "$expected" "$target"
          test "$(docker inspect --format '{{.Id}}' "$target")" = "$expected"
          docker push "$target"
          actual="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)"
          test "$actual" = "$expected"

      - name: Archive publication security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-security
          path: |
            artifacts/publication-security/*.json
            artifacts/publication-security/*.log
          if-no-files-found: warn
