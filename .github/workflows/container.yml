name: Container image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Resolve and validate the release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a semantic version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Run the complete Scala test suite
        run: |
          chmod 0755 sbt
          ./sbt test

      - name: Validate the Dockerfile
        run: docker build --check .

      - name: Build the smoke-test image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.release.outputs.version }}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --tag cascade:smoke \
            .

      - name: Start Cascade as a non-root read-only container
        run: |
          docker volume create cascade-smoke-data
          docker run --detach \
            --name cascade-smoke \
            --init \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,nosuid,nodev,noexec \
            --volume cascade-smoke-data:/var/lib/cascade \
            --publish 19092:9092 \
            cascade:smoke \
            --host 0.0.0.0 \
            --port 9092 \
            --advertised-host localhost \
            --advertised-port 19092 \
            --data-dir /var/lib/cascade \
            --operations-port 9404

      - name: Wait for readiness
        run: |
          for _attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cascade-smoke)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' cascade-smoke)" = exited ]; then
              docker logs cascade-smoke
              exit 1
            fi
            sleep 1
          done
          docker inspect cascade-smoke
          docker logs cascade-smoke
          exit 1

      - name: Verify image security metadata and Kafka data flow
        run: |
          test "$(docker inspect --format '{{.Config.User}}' cascade:smoke)" = "65532:65532"
          ./sbt "Test/runMain cascade.e2e.ExternalBrokerSmokeTest 127.0.0.1:19092 container-smoke-ci"

      - name: Verify graceful restart and volume recovery
        run: |
          docker restart --timeout 120 cascade-smoke
          for _attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' cascade-smoke)" = healthy ]; then
              ./sbt "Test/runMain cascade.e2e.ExternalBrokerSmokeTest 127.0.0.1:19092 container-smoke-ci --verify-only"
              exit 0
            fi
            sleep 1
          done
          docker logs cascade-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs cascade-smoke || true

      - name: Remove smoke-test resources
        if: always()
        run: |
          docker rm --force cascade-smoke || true
          docker volume rm cascade-smoke-data || true

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/cascade
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push multi-platform image with provenance
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
